window:
  startup_mode: Maximized

# shell:
#   program: /usr/local/bin/bash
#   args: ["--login", "-i"]

env:
  TURBO_MODE: "1"

font:
  normal:
    # NOTE: fonts live in ~/.local/share/fonts,
    # font config lives in ~/.config/fontconfig/fonts.conf

    # family: "FiraCode Nerd Font Propo"
    # style: Retina
    # 😀😃😄😁🙃😗🤪🤑🤐😏😒🙄🤯🤠😕🙁
    # family: "FiraCode Nerd Font with Fallback"
    family: "JetBrains Mono with Fallback"

  size: 8.0

draw_bold_text_with_bright_colors: true

# Colors (Tomorrow Night)
colors:
  primary:
    background: '#1d1f21'
    foreground: '#c5c8c6'

    dim_foreground: '#828482'
    bright_foreground: '#eaeaea'

  normal:
    black:   '#1d1f21'
    red:     '#cc5555'
    green:   '#72bd68'
    yellow:  '#e8e268'
    blue:    '#6192be'
    magenta: '#a254ab'
    cyan:    '#4abeb7'
    white:   '#c5c8c6'

  bright:
   black:   '#444444'
   red:     '#e56e73'
   green:   '#49fa4a'
   yellow:  '#ffff67'
   blue:    '#7aa6da'
   magenta: '#c397d8'
   cyan:    '#70c0b1'
   white:   '#eaeaea'
